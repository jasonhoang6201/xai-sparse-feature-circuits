<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edge trong circuit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#dcdad3;--hi:#c0392b;--hibg:#fdecea;--grn:#1e8449;--grnbg:#e8f6ee;--org:#b9770e;--orgbg:#fdf2e0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",sans-serif;line-height:1.55}
main{max-width:1100px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:24px;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 16px}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}
code,.mono{font-family:"JetBrains Mono",monospace;font-size:14px}
.pipe{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pipe span{border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer;color:var(--mute);background:#fff}
.pipe span.on{background:var(--hi);border-color:var(--hi);color:#fff;font-weight:600}
.nav{display:flex;gap:10px;margin-bottom:12px}
.nav button{font:inherit;font-size:15px;padding:7px 16px;border-radius:8px;border:2px solid var(--ink);background:#fff;cursor:pointer}
.nav button:disabled{opacity:.3;cursor:default}
h2{font-size:20px;margin:6px 0 8px}
.explain{border-left:4px solid var(--hi);background:var(--hibg);padding:12px 16px;border-radius:0 8px 8px 0;margin:12px 0}
.ok{border-left-color:var(--grn);background:var(--grnbg)}
.scroll{overflow-x:auto}
svg text{font-family:"Be Vietnam Pro",sans-serif}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--mute);margin-top:6px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:5px;border:2px solid}
table{border-collapse:collapse;margin:10px 0;font-size:14px}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left}
th{background:#f1efe9}
td.n{font-family:"JetBrains Mono",monospace;text-align:right}
tr.keep td{background:var(--grnbg)}
tr.drop td{color:var(--mute);text-decoration:line-through}
</style>
</head>
<body>
<main>
<h1>Edge chứa gì: ví dụ "The keys to the cabinet ___"</h1>
<p class="sub">Ví dụ đơn giản, đã giảm chiều cho dễ hiểu: chỉ vẽ 4 node đã qua bước lọc node (A, B, C, D). Mọi giá trị là số minh họa, không lấy từ paper. Dùng ← → để chuyển bước.</p>

<section>
  <div class="pipe" id="pipe"></div>
  <div class="nav"><button id="prev">← Trước</button><button id="next">Tiếp →</button></div>
  <h2 id="ttl"></h2>
  <div class="scroll"><svg id="g" width="1000" height="400" viewBox="0 0 1000 400"></svg></div>
  <div class="legend">
    <span><i style="background:#fff;border-color:#1d1d1f"></i>giá trị câu gốc</span>
    <span><i style="background:#fdecea;border-color:#c0392b"></i>bị patch</span>
    <span><i style="background:#eee;border-color:#9a9a9a"></i>bị giữ ở giá trị câu gốc</span>
    <span><i style="background:#fdf2e0;border-color:#b9770e"></i>thay đổi theo</span>
  </div>
  <div id="txt"></div>
</section>
</main>

<script>
const NS='http://www.w3.org/2000/svg',svg=document.getElementById('g');
function el(t,a,txt,parent){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!==undefined)e.textContent=txt;(parent||svg).appendChild(e);return e}
const P={A:[120,200],C:[400,80],D:[400,320],B:[640,200],m:[880,200]};
const NAME={A:['A: "danh từ số nhiều"','tại token "keys"'],C:['C: feature trung gian','tại token "to"'],D:['D: feature khác','tại token "cabinet"'],B:['B: "chủ ngữ số nhiều"','tại token cuối'],m:['m = log P(is) − log P(are)','output, token cuối']};
const EDGES=[['A','C'],['A','B'],['A','D'],['C','B'],['B','m'],['D','m']];
const ST={
  normal:{fill:'#fff',stroke:'#1d1d1f'},patch:{fill:'#fdecea',stroke:'#c0392b'},
  frozen:{fill:'#eee',stroke:'#9a9a9a'},change:{fill:'#fdf2e0',stroke:'#b9770e'}};

const steps=[
 {t:'1. Graph sau khi lọc node: edge chưa có số',
  val:{A:'?',C:'?',D:'?',B:'?',m:'?'},st:{},lab:{AC:'?',AB:'?',AD:'?',CB:'?'},
  txt:`<p>Bước lọc node giữ lại 4 feature A, B, C, D. Mũi tên là các đường nối có thể có giữa chúng (theo thứ tự layer và token). <b>Trên mũi tên chưa có gì cả</b>: model không lưu số nào cho đường nối giữa hai feature.</p>
  <div class="explain">Việc cần làm: gán cho mỗi mũi tên <b>một con số</b>, đó là output đổi bao nhiêu do đường nối đó. Con số này gọi là giá trị của edge.</div>`},
 {t:'2. Chạy câu gốc "The keys…" và câu patch "The key…"',
  val:{A:'3',C:'1',D:'0.5',B:'2',m:'−3'},st:{},lab:{},
  txt:`<p>Chạy model trên câu gốc, lưu giá trị mọi node: A = 3, C = 1, D = 0.5, B = 2, và m = −3 (âm: model nghiêng về "are", đúng cho "keys").</p>
  <p>Chạy câu patch "The key…" (số ít), chỉ cần lấy một số: <b>A trên câu patch = 0</b>, vì "key" không phải danh từ số nhiều.</p>`},
 {t:'3. Đo edge A → B',
  val:{A:'3 → 0',C:'1',D:'0.5',B:'2 → 0.8',m:'−3 → −0.6'},st:{A:'patch',C:'frozen',D:'frozen',B:'change',m:'change'},hl:['AB','Bm'],lab:{AB:'?'},
  txt:`<p>Chạy lại câu gốc, nhưng:</p>
  <ol><li>Đặt A = 0 (giá trị của A trên câu patch).</li>
  <li>C nằm giữa A và B nên <b>giữ C = 1</b>. Như vậy B chỉ nhận thay đổi trực tiếp từ A, không nhận phần đi vòng qua C.</li>
  <li>D không nằm trên đường tới B, cũng giữ nguyên.</li>
  <li>B đổi từ 2 → 0.8. Sau B mọi thứ chạy bình thường: m đổi từ −3 → −0.6.</li></ol>
  <div class="explain">m thay đổi <b>+2.4</b> (model nghiêng về "is" hơn). Đây là giá trị của edge A → B.</div>`},
 {t:'4. Đo edge A → C (một lần chạy riêng)',
  val:{A:'3 → 0',C:'1 → 0.4',D:'0.5',B:'2 → 1.7',m:'−3 → −2.4'},st:{A:'patch',D:'frozen',C:'change',B:'change',m:'change'},hl:['AC','CB','Bm'],lab:{AB:'2.4',AC:'?'},
  txt:`<p>Lần này chỉ cho C nhận thay đổi từ A: C đổi 1 → 0.4. Sau C mọi thứ chạy bình thường, nên B đổi theo C (2 → 1.7), rồi m đổi −3 → −2.4.</p>
  <div class="explain">m thay đổi <b>+0.6</b>. Đây là giá trị của edge A → C.</div>`},
 {t:'5. Đo edge A → D',
  val:{A:'3 → 0',C:'1',D:'0.5 → 0.45',B:'2',m:'−3 → −2.95'},st:{A:'patch',C:'frozen',B:'frozen',D:'change',m:'change'},hl:['AD','Dm'],lab:{AB:'2.4',AC:'0.6',AD:'?'},
  txt:`<p>Chỉ cho D nhận thay đổi từ A: D đổi rất ít (0.5 → 0.45), m chỉ đổi −3 → −2.95.</p>
  <div class="explain">m thay đổi <b>+0.05</b>. Edge A → D gần như không góp gì cho dự đoán is/are.</div>
  <p>Edge C → B đo theo cách tương tự, chỉ khác là patch C. Giả sử kết quả là 0.9.</p>`},
 {t:'6. Lọc edge với ngưỡng T_E = 0.5',
  val:{A:'',C:'',D:'',B:'',m:''},st:{},lab:{AB:'2.4',AC:'0.6',AD:'0.05',CB:'0.9'},
  txt:`<table><tr><th>Edge</th><th>Giá trị (m đổi bao nhiêu)</th><th>So với T_E = 0.5</th></tr>
  <tr class="keep"><td>A → B</td><td class="n">2.4</td><td>giữ</td></tr>
  <tr class="keep"><td>C → B</td><td class="n">0.9</td><td>giữ</td></tr>
  <tr class="keep"><td>A → C</td><td class="n">0.6</td><td>giữ</td></tr>
  <tr class="drop"><td>A → D</td><td class="n">0.05</td><td>bỏ</td></tr></table>
  <p class="note">T_E (ngưỡng cho edge) ở đây là số minh họa.</p>`},
 {t:'7. Circuit cuối cùng',
  val:{A:'',C:'',D:'',B:'',m:''},st:{},lab:{AB:'2.4',AC:'0.6',CB:'0.9'},drop:['AD','Dm'],
  txt:`<div class="explain ok"><b>Edge chứa gì:</b> đúng một con số do người nghiên cứu đo ra, là mức thay đổi của m khi tác động của A chỉ đi tới output qua B. Con số này không có sẵn trong model.<br>
  <b>Dùng để làm gì:</b> (1) bỏ edge yếu (A → D) và (2) đọc ra đường đi chính của thông tin: "danh từ số nhiều" ở "keys" truyền chủ yếu thẳng tới "chủ ngữ số nhiều" ở token cuối (2.4), một phần đi vòng qua C (0.6 rồi 0.9).</div>`},
 {t:'8. Cách paper tính nhanh cùng con số đó',
  val:{A:'3 → 0',C:'',D:'',B:'',m:''},st:{},hl:['AB','Bm'],lab:{AB:'2.4'},
  txt:`<p>Bước 3 cần một lần chạy riêng cho mỗi edge. Paper không chạy từng lần như vậy, mà ước lượng bằng 3 con số nhân với nhau:</p>
  <table><tr><th>Câu hỏi</th><th>Con số</th></tr>
  <tr><td>A thay đổi bao nhiêu giữa hai câu?</td><td class="n">0 − 3 = −3</td></tr>
  <tr><td>A đổi 1 đơn vị thì B đổi bao nhiêu? (C giữ nguyên)</td><td class="n">0.4</td></tr>
  <tr><td>B đổi 1 đơn vị thì m đổi bao nhiêu?</td><td class="n">−2</td></tr>
  <tr><td><b>Nhân lại</b></td><td class="n">(−3) × 0.4 × (−2) = 2.4</td></tr></table>
  <p>Hai con số cuối lấy từ một lần chạy ngược, giống AtP ở slide 20. Kết quả trùng với bước 3 vì trong ví dụ này mọi quan hệ đều tuyến tính; ở model thật đây là xấp xỉ.</p>`}
];

let cur=0;
const pipe=document.getElementById('pipe');
steps.forEach((s,i)=>{const sp=document.createElement('span');sp.textContent=i+1;sp.onclick=()=>show(i);pipe.appendChild(sp)});
function arrow(a,b,col,w,dash){
  const [x1,y1]=P[a],[x2,y2]=P[b];
  const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;
  const r1=a==='m'?90:46,r2=b==='m'?95:48;
  el('line',{x1:x1+ux*r1,y1:y1+uy*r1,x2:x2-ux*r2,y2:y2-uy*r2,stroke:col,'stroke-width':w,'marker-end':'url(#ah'+(col==='#c0392b'?'r':'g')+')','stroke-dasharray':dash||''});
}
function show(i){
  cur=i;const s=steps[i];
  svg.innerHTML='';
  const d=el('defs',{});
  [['g','#9a9a9a'],['r','#c0392b']].forEach(([k,c])=>{const m=el('marker',{id:'ah'+k,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto'},undefined,d);el('path',{d:'M0,0 L10,5 L0,10 z',fill:c},undefined,m)});
  EDGES.forEach(([a,b])=>{
    const k=a+b;if(s.drop&&s.drop.includes(k))return;
    const on=s.hl&&s.hl.includes(k);
    const val=s.lab[k];const w=s.lab[k]&&!isNaN(parseFloat(s.lab[k]))?1.5+parseFloat(s.lab[k])*1.5:2;
    arrow(a,b,on?'#c0392b':'#9a9a9a',on?3.5:w);
    if(val!==undefined){
      const [x1,y1]=P[a],[x2,y2]=P[b];const mx=(x1+x2)/2,my=(y1+y2)/2-10;
      el('rect',{x:mx-26,y:my-14,width:52,height:22,rx:6,fill:'#fff',stroke:'#1d1d1f'});
      el('text',{x:mx,y:my+2,'text-anchor':'middle','font-size':13,'font-weight':700},val);
    }
  });
  Object.keys(P).forEach(k=>{
    const [x,y]=P[k];const st=ST[s.st[k]||'normal'];
    if(k==='m'){el('rect',{x:x-90,y:y-34,width:180,height:68,rx:10,fill:st.fill,stroke:st.stroke,'stroke-width':2})}
    else el('circle',{cx:x,cy:y,r:44,fill:st.fill,stroke:st.stroke,'stroke-width':2});
    el('text',{x,y:y+6,'text-anchor':'middle','font-size':15,'font-weight':700,'font-family':'JetBrains Mono,monospace'},s.val[k]||k);
    el('text',{x,y:k==='m'?y+56:y+64,'text-anchor':'middle','font-size':12,'font-weight':600},NAME[k][0]);
    el('text',{x,y:k==='m'?y+72:y+80,'text-anchor':'middle','font-size':11,fill:'#6b6b70'},NAME[k][1]);
    if(s.st[k]==='frozen')el('text',{x,y:y-50,'text-anchor':'middle','font-size':11,fill:'#6b6b70'},'giữ nguyên');
  });
  document.getElementById('ttl').textContent=s.t;
  document.getElementById('txt').innerHTML=s.txt;
  [...pipe.children].forEach((c,j)=>c.classList.toggle('on',j===i));
  document.getElementById('prev').disabled=i===0;
  document.getElementById('next').disabled=i===steps.length-1;
}
document.getElementById('prev').onclick=()=>cur>0&&show(cur-1);
document.getElementById('next').onclick=()=>cur<steps.length-1&&show(cur+1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&cur<steps.length-1)show(cur+1);if(e.key==='ArrowLeft'&&cur>0)show(cur-1)});
show(0);
</script>
</body>
</html>
